on:
  pull_request:
    paths:
      - '!**.md'
      - 'helfi-search/**'
      - '.github/workflows/helfi-search-image-tests.yml'
  push:
    branches: [ main ]
    paths:
      - '!**.md'
      - 'helfi-search/**'
      - '.github/workflows/helfi-search-image-tests.yml'
  # Weekly, to catch new vulnerabilities and upstream changes.
  schedule:
    - cron: '0 5 * * 1'
name: Helfi search image tests
jobs:
  tests:
    name: Helfi search image tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:latest
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run tests
        working-directory: helfi-search
        run: make test

  scan:
    name: Scan ${{ matrix.target }} for vulnerabilities
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: webhook
            fail-build: true
          # The crawler's vulnerabilities are in Elastic's image (OpenJDK, Ruby
          # gems, Chainguard packages), which we can't fix: report them only.
          - target: elasticsearch-crawler
            fail-build: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        working-directory: helfi-search
        run: docker buildx bake --load --set "$TARGET.platform=linux/amd64" --set "$TARGET.tags=scan:$TARGET" "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Scan for vulnerabilities
        uses: anchore/scan-action@8576240a41341d866dbd7ebc72cd9fc0ef023f54 # v7.4.2
        with:
          image: scan:${{ matrix.target }}
          # Fail on high and critical vulnerabilities that have a fix.
          severity-cutoff: high
          only-fixed: true
          output-format: table
          fail-build: ${{ matrix.fail-build }}
